<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말랑 보이스</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            background: #fff5f8;
            color: #40263d;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        main {
            max-width: 760px;
            margin: auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .logo {
            display: grid;
            place-items: center;
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            border-radius: 22px;
            background: #ed568a;
            color: white;
            font-size: 32px;
            box-shadow: 0 5px 0 #ce3b6e;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 7px 0 0;
            color: #88677e;
            font-size: 16px;
        }

        .card {
            padding: 32px;
            background: white;
            border: 2px solid #f6dfeb;
            border-radius: 30px;
            box-shadow: 0 12px 0 #f5e3ed;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        label,
        legend {
            font-size: 17px;
            font-weight: bold;
        }

        .badge {
            padding: 8px 12px;
            border-radius: 20px;
            background: #fff1bf;
            color: #755912;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 210px;
            padding: 20px;
            resize: vertical;
            border: 2px solid #eadfea;
            border-radius: 20px;
            background: #fffcfe;
            color: #40263d;
            font: 18px/1.8 Arial, "Malgun Gothic", sans-serif;
        }

        textarea:focus {
            outline: 3px solid #ffd6e5;
            border-color: #ed568a;
        }

        .count {
            margin: 8px 3px 24px;
            text-align: right;
            color: #88677e;
            font-size: 14px;
        }

        fieldset {
            margin: 0;
            padding: 0;
            border: 0;
        }

        legend {
            margin-bottom: 14px;
        }

        .languages {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .language {
            position: relative;
        }

        .language input {
            position: absolute;
            opacity: 0;
        }

        .language span {
            display: block;
            padding: 18px 6px;
            border: 2px solid #eee2eb;
            border-radius: 17px;
            background: white;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
        }

        .language small {
            display: block;
            margin-top: 6px;
            color: #88677e;
            font-size: 14px;
            font-weight: normal;
        }

        .language input:checked + span {
            border-color: #ed568a;
            background: #fff0f6;
            color: #be3267;
        }

        .language input:focus-visible + span {
            outline: 3px solid #8245a2;
            outline-offset: 3px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 26px;
        }

        button {
            padding: 17px 24px;
            border: 0;
            border-radius: 17px;
            font: 700 17px Arial, "Malgun Gothic", sans-serif;
            cursor: pointer;
        }

        #play {
            flex: 1;
            background: #ed568a;
            color: white;
            box-shadow: 0 4px 0 #c9396c;
        }

        #play:hover {
            background: #dd477e;
        }

        #stop {
            background: #f2edf7;
            color: #6c5482;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        button:focus-visible {
            outline: 3px solid #8245a2;
            outline-offset: 5px;
        }

        #status {
            min-height: 26px;
            margin: 22px 0 0;
            color: #795970;
            font-size: 15px;
            line-height: 1.7;
        }

        .note {
            margin: 24px 12px;
            text-align: center;
            color: #88677e;
            font-size: 14px;
            line-height: 1.8;
        }

        .speaking .logo {
            animation: bop 0.7s ease-in-out infinite alternate;
        }

        @keyframes bop {
            to {
                transform: rotate(-9deg) translateY(-4px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .speaking .logo {
                animation: none;
            }
        }

        @media (max-width: 540px) {
            body {
                padding: 25px 14px;
            }

            .card {
                padding: 22px 18px;
            }

            .languages {
                gap: 7px;
            }

            .language span {
                padding: 15px 4px;
                font-size: 14px;
            }

            .language small {
                font-size: 12px;
            }

            h1 {
                font-size: 25px;
            }

            .badge {
                display: none;
            }

            button {
                padding: 16px;
            }

            textarea {
                height: 230px;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <div class="logo" aria-hidden="true">♫</div>

            <div>
                <h1>말랑 보이스</h1>
                <p>듣고 싶은 단어나 문장을 적어주세요.</p>
            </div>
        </header>

        <section class="card">
            <div class="top">
                <label for="text">어떤 말을 들어볼까요?</label>
                <span class="badge">작은 나만의 듣기 시간</span>
            </div>

            <textarea
                id="text"
                maxlength="5000"
                placeholder="예: I have an apple. The apple is red.&#10;또는: 오늘도 좋은 하루 보내세요!"
            ></textarea>

            <p class="count">
                <span id="count">0</span> / 5,000
            </p>

            <fieldset>
                <legend>목소리 선택</legend>

                <div class="languages">
                    <label class="language">
                        <input
                            type="radio"
                            name="language"
                            value="en-US"
                            checked
                        >
                        <span>
                            🇺🇸 미국 영어
                            <small>American English</small>
                        </span>
                    </label>

                    <label class="language">
                        <input
                            type="radio"
                            name="language"
                            value="en-GB"
                        >
                        <span>
                            🇬🇧 영국 영어
                            <small>British English</small>
                        </span>
                    </label>

                    <label class="language">
                        <input
                            type="radio"
                            name="language"
                            value="ko-KR"
                        >
                        <span>
                            🇰🇷 한국어
                            <small>Korean</small>
                        </span>
                    </label>
                </div>
            </fieldset>

            <div class="actions">
                <button id="play" type="button">
                    ▶ 소리 듣기
                </button>

                <button id="stop" type="button" disabled>
                    ■ 정지
                </button>
            </div>

            <p id="status" role="status" aria-live="polite">
                내용을 입력하고 소리 듣기를 눌러주세요.
            </p>
        </section>

        <p class="note">
            영어는 영어 목소리로, 한국어는 한국어 목소리로 들어보세요.<br>
            사용 가능한 목소리는 기기와 브라우저에 따라 달라요.
        </p>
    </main>

    <script>
        const text = document.getElementById("text");
        const playButton = document.getElementById("play");
        const stopButton = document.getElementById("stop");
        const statusMessage = document.getElementById("status");

        const supported = "speechSynthesis" in window;

        const languageNames = {
            "en-US": "미국 영어",
            "en-GB": "영국 영어",
            "ko-KR": "한국어"
        };

        let voices = [];
        let currentSpeech = null;
        let playbackId = 0;

        // 현재 선택한 언어를 확인해요.
        function getLanguage() {
            return document.querySelector(
                'input[name="language"]:checked'
            ).value;
        }

        // 브라우저에서 사용 가능한 목소리를 불러와요.
        function refreshVoices() {
            if (supported) {
                voices = window.speechSynthesis.getVoices();
            }
        }

        // 재생 상태에 따라 버튼과 애니메이션을 바꿔요.
        function updatePlaybackState(isPlaying) {
            document.body.classList.toggle("speaking", isPlaying);
            stopButton.disabled = !isPlaying;

            playButton.textContent = isPlaying
                ? "↻ 처음부터 다시 듣기"
                : "▶ 소리 듣기";
        }

        // 이전 재생을 멈춰요.
        function cancelSpeech() {
            playbackId++;

            if (supported) {
                window.speechSynthesis.cancel();
            }

            updatePlaybackState(false);
        }

        // 입력한 텍스트를 선택한 목소리로 읽어요.
        function speakText() {
            const content = text.value.trim();

            if (!content) {
                statusMessage.textContent =
                    "먼저 단어나 문장을 입력해주세요.";

                text.focus();
                return;
            }

            if (!supported) {
                statusMessage.textContent =
                    "이 브라우저는 음성 재생을 지원하지 않아요. " +
                    "다른 브라우저에서 열어주세요.";

                return;
            }

            refreshVoices();

            const language = getLanguage();

            const selectedVoice = voices.find(function(voice) {
                const voiceLanguage = voice.lang
                    .toLowerCase()
                    .replace("_", "-");

                return voiceLanguage === language.toLowerCase();
            });

            cancelSpeech();

            if (!selectedVoice) {
                statusMessage.textContent =
                    languageNames[language] +
                    " 목소리를 아직 찾지 못했어요. " +
                    "잠시 후 다시 눌러보거나, " +
                    "기기에 해당 언어의 음성을 설치해주세요.";

                return;
            }

            const thisPlaybackId = playbackId;

            currentSpeech = new SpeechSynthesisUtterance(content);
            currentSpeech.voice = selectedVoice;
            currentSpeech.lang = language;
            currentSpeech.rate = 0.9;
            currentSpeech.pitch = 1;
            currentSpeech.volume = 1;

            currentSpeech.onstart = function() {
                if (thisPlaybackId !== playbackId) {
                    return;
                }

                updatePlaybackState(true);

                statusMessage.textContent =
                    languageNames[language] + "로 읽고 있어요. ♫";
            };

            currentSpeech.onend = function() {
                if (thisPlaybackId !== playbackId) {
                    return;
                }

                updatePlaybackState(false);

                statusMessage.textContent =
                    "다 들었어요! 다시 듣거나 다른 목소리를 골라보세요.";
            };

            currentSpeech.onerror = function() {
                if (thisPlaybackId !== playbackId) {
                    return;
                }

                updatePlaybackState(false);

                statusMessage.textContent =
                    "소리를 재생하지 못했어요. 다시 눌러주세요.";
            };

            statusMessage.textContent = "목소리를 준비하고 있어요…";
            updatePlaybackState(true);

            window.speechSynthesis.speak(currentSpeech);
        }

        // 입력한 글자 수를 보여줘요.
        text.addEventListener("input", function() {
            document.getElementById("count").textContent =
                text.value.length;
        });

        playButton.addEventListener("click", speakText);

        stopButton.addEventListener("click", function() {
            cancelSpeech();
            statusMessage.textContent = "재생을 멈췄어요.";
        });

        // 목소리를 바꾸면 기존 재생을 멈춰요.
        document.querySelectorAll(
            'input[name="language"]'
        ).forEach(function(radio) {
            radio.addEventListener("change", function() {
                cancelSpeech();

                statusMessage.textContent =
                    languageNames[getLanguage()] + "를 선택했어요.";
            });
        });

        if (supported) {
            refreshVoices();

            window.speechSynthesis.addEventListener(
                "voiceschanged",
                refreshVoices
            );
        } else {
            playButton.disabled = true;

            statusMessage.textContent =
                "이 브라우저는 음성 재생을 지원하지 않아요.";
        }

        // 페이지를 닫거나 이동하면 소리를 멈춰요.
        window.addEventListener("pagehide", cancelSpeech);
    </script>
</body>
</html>
