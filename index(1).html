<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First English Learning App</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 20px;
            padding: 12px;
            margin: 5px;
            background-color: lightblue;
        }
    </style>
</head>

<body>
    <!-- HTML: Change what learners see -->
    <h1>Vocabulary Quiz</h1>

    <p id="progress"></p>
    <p id="question"></p>

    <div id="choices"></div>

    <h3 id="feedback" aria-live="polite"></h3>

    <button id="nextButton" onclick="nextQuestion()" hidden>
        Next
    </button>

    <!-- JavaScript: Change what happens -->
    <script>
        const questions = [
            {
                word: "take part in",
                choices: ["Participate in", "Avoid", "Watch"],
                correct: "Participate in",
                hint: "You take part in a school play when you are one of the actors.",
                explanation: '"Take part in" means to join an activity.'
            },
            {
                word: "look after",
                choices: ["Search for", "Take care of", "Look at"],
                correct: "Take care of",
                hint: "You look after a dog by feeding it and keeping it safe.",
                explanation: '"Look after" means to care for someone or something.'
            },
            {
                word: "give up",
                choices: ["Give a gift", "Start again", "Stop trying"],
                correct: "Stop trying",
                hint: "The puzzle was difficult, but she did not give up. She kept trying.",
                explanation: '"Give up" means to stop trying to do something.'
            },
            {
                word: "find out",
                choices: ["Discover", "Forget", "Lose"],
                correct: "Discover",
                hint: "You ask your teacher to find out when the test will be.",
                explanation: '"Find out" means to learn or discover information.'
            },
            {
                word: "put off",
                choices: ["Finish", "Postpone", "Wear"],
                correct: "Postpone",
                hint: "Because of the rain, we put off the picnic until next week.",
                explanation: '"Put off" means to delay something until a later time.'
            }
        ];

        let currentQuestion = 0;
        let incorrectAttempts = 0;
        let answered = false;

        function showQuestion() {
            const quiz = questions[currentQuestion];

            incorrectAttempts = 0;
            answered = false;

            document.getElementById("progress").innerText =
                `Question ${currentQuestion + 1} of ${questions.length}`;

            document.getElementById("question").innerText =
                `What does "${quiz.word}" mean?`;

            document.getElementById("feedback").innerText = "";
            document.getElementById("nextButton").hidden = true;

            const choices = document.getElementById("choices");
            choices.innerHTML = "";

            quiz.choices.forEach(function(choice) {
                const button = document.createElement("button");
                button.innerText = choice;

                button.onclick = function() {
                    checkAnswer(choice, button);
                };

                choices.appendChild(button);
            });
        }

        function checkAnswer(answer, selectedButton) {
            if (answered) {
                return;
            }

            const quiz = questions[currentQuestion];
            const feedback = document.getElementById("feedback");

            if (answer === quiz.correct) {
                feedback.innerText =
                    "Correct! Well done! " + quiz.explanation;

                finishQuestion();
            } else {
                incorrectAttempts++;

                if (incorrectAttempts === 1) {
                    feedback.innerText =
                        "Not quite. Hint: " + quiz.hint + " Try again!";

                    // Prevent choosing the same wrong answer again.
                    selectedButton.disabled = true;
                } else {
                    feedback.innerText =
                        "The correct answer is " + quiz.correct + ". " +
                        quiz.explanation;

                    finishQuestion();
                }
            }
        }

        function finishQuestion() {
            answered = true;

            document.querySelectorAll("#choices button").forEach(
                function(button) {
                    button.disabled = true;
                }
            );

            const nextButton = document.getElementById("nextButton");
            nextButton.innerText =
                currentQuestion === questions.length - 1
                    ? "Finish"
                    : "Next";

            nextButton.hidden = false;
        }

        function nextQuestion() {
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                document.getElementById("progress").innerText = "";
                document.getElementById("question").innerText =
                    "You have finished all five expressions!";

                document.getElementById("choices").innerHTML = "";
                document.getElementById("feedback").innerText =
                    "Great work!";

                document.getElementById("nextButton").hidden = true;
            }
        }

        showQuestion();
    </script>
</body>
</html>
